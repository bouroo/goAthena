version: "2"
run:
  tests: true
  timeout: 5m
linters:
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nestif
    - nilerr
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unused
    - wrapcheck
  disable:
    - lll
  settings:
    depguard:
      rules:
        # Every module package is forbidden from importing the composition root:
        # internal/app is a wiring sink, and a module importing it forms a cycle.
        module_no_composition_root:
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: "github.com/bouroo/goAthena/internal/app"
              desc: "modules must not import the composition root (internal/app)"
        # The domain layer of every module is pure: it defines ports and value
        # objects only and may never reach down into persistence drivers, the
        # shared infrastructure package, or the composition root. Clean-architecture
        # invariant mirrored by internal/app/arch_test.go (defense in depth).
        module_domain_purity:
          files:
            - "**/internal/modules/**/domain/**"
          deny:
            - pkg: "gorm.io"
              desc: "domain must not depend on persistence; define a port instead"
            - pkg: "github.com/valkey-io"
              desc: "domain must not depend on persistence; define a port instead"
            - pkg: "github.com/redis/go-redis"
              desc: "domain must not depend on persistence; define a port instead"
            - pkg: "github.com/nats-io"
              desc: "domain must not depend on persistence; define a port instead"
            - pkg: "github.com/bouroo/goAthena/internal/infrastructure"
              desc: "domain must not import infrastructure; depend on a port"
            - pkg: "github.com/bouroo/goAthena/internal/app"
              desc: "modules must not import the composition root (internal/app)"
    dupl:
      threshold: 20
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    exhaustive:
      default-signifies-exhaustive: true
    testifylint:
      disable:
        - float-compare
    wrapcheck:
      ignore-sig-regexps:
        - "github.com/labstack/echo/v5.HTTPError"
        - 'github.com/labstack/echo/v5\.Context\.JSON'
        - 'github.com/bouroo/goAthena/internal/shared/errors\.GRPCErr'
        - 'google.golang.org/grpc/status\.Error'
  exclusions:
    generated: lax
    paths:
      - examples$
    rules:
      - linters:
          - revive
        text: "^unused-parameter:"
      - linters:
          - revive
        text: "^package-comments:"
      - linters:
          - errcheck
        text: 'Error return value of `.*\.Body\.Close` is not checked'
      - linters:
          - dupl
          - goconst
          - funlen
          - errcheck
          - forcetypeassert
          - revive
          - wrapcheck
        path: '_test\.go$'
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
