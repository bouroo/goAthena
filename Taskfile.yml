version: '3'

dotenv:
  - .env

vars:
  BIN_DIR: bin
  BINARY_NAME: goathena
  COVERAGE_OUT: coverage.out
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

  LDFLAGS: -s -w -X main.Version={{.GIT_VERSION | default "dev"}} -X main.CommitSHA={{.GIT_COMMIT | default "unknown"}} -X main.BuildTime={{.BUILD_TIME | default "unknown"}}

tasks:
  build:
    desc: Build the goathena modular-monolith binary (serve + migrate subcommands)
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.BINARY_NAME}} ./cmd/goathena

  serve:
    desc: Build and run `goathena serve`
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} serve

  version:
    desc: Build and print the goathena build version
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} version

  test:
    desc: Run all tests (default unit tag)
    cmds:
      - task: test-unit

  test-unit:
    desc: Run unit tests only
    cmds:
      - go test -race -tags=unit -coverprofile={{.COVERAGE_OUT}} -coverpkg=./internal/...,./pkg/... ./internal/... ./pkg/...

  test-integration:
    desc: Run integration tests (requires mariadb + valkey + nats)
    cmds:
      - go test -v -race -tags=integration ./...

  test-e2e:
    desc: Run end-to-end tests (boots full server)
    cmds:
      - go test -v -race -tags=e2e ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --timeout=5m ./...

  fmt:
    desc: Format Go source
    cmds:
      - gofumpt -w .
      - goimports -w .

  tidy:
    desc: Tidy go.mod and verify
    cmds:
      - go mod tidy
      - go mod verify

  verify:
    desc: Verify module state and no diff
    cmds:
      - task: tidy
      - git diff --exit-code go.mod go.sum

  generate:
    desc: Generate mocks via go generate
    cmds:
      - go generate ./...

  migrate-up:
    desc: Apply all pending database migrations (`goathena migrate up`)
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} migrate up

  migrate-down:
    desc: Roll back one database migration (`goathena migrate down 1`)
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} migrate down 1

  migrate-version:
    desc: Print the current migration version (`goathena migrate version`)
    deps:
      - build
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} migrate version

  migrate-create:
    desc: "Create a new migration: task migrate-create NAME=add_users"
    cmds:
      - migrate create -ext sql -dir internal/infrastructure/db/migrations {{.NAME}}

  docker-build:
    desc: Build the goathena container image
    cmds:
      - docker build -f Containerfile -t goathena:latest .

  cover-html:
    desc: Render coverage report to HTML
    cmds:
      - go tool cover -html={{.COVERAGE_OUT}} -o coverage.html
