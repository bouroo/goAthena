version: '3'

vars:
  BINARY: bin/goathena

tasks:
  default:
    desc: Build the goathena binary into ./bin
    cmds:
      - go build -o {{.BINARY}} ./cmd/goathena

  build:
    desc: Build the goathena binary into ./bin
    cmds:
      - go build -o {{.BINARY}} ./cmd/goathena

  build-tools:
    desc: Build cmd/goathena, cmd/healthcheck, and cmd/loadgen
    cmds:
      - go build -o {{.BINARY}} ./cmd/goathena
      - go build -o bin/healthcheck ./cmd/healthcheck
      - go build -o bin/loadgen ./cmd/loadgen

  serve:
    desc: Build + run `goathena serve` (blocks until SIGINT/SIGTERM)
    deps: [build]
    cmds:
      - ./{{.BINARY}} serve {{.CLI_ARGS}}

  fmt:
    desc: Format the tree (gofumpt + goimports)
    cmds:
      - gofumpt -w .
      - goimports -w -local github.com/bouroo/goAthena .

  fmt-check:
    desc: Fail if any file needs formatting (gofumpt + goimports); does not write
    cmds:
      - |
        missing=""
        for t in gofumpt goimports; do
          command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
        done
        if [ -n "$missing" ]; then
          echo "missing formatter(s):$missing"
          echo "install: go install mvdan.cc/gofumpt@v0.11.0 golang.org/x/tools/cmd/goimports@latest"
          exit 2
        fi
        out="$(gofumpt -l .; goimports -l -local github.com/bouroo/goAthena .)"
        out="$(printf '%s\n' "$out" | grep -v '^third_party/' | sed '/^$/d' | sort -u)"
        if [ -n "$out" ]; then
          echo "needs task fmt:"
          printf '%s\n' "$out"
          exit 1
        fi

  lint:
    desc: Run golangci-lint v2
    cmds:
      - golangci-lint run --timeout=5m ./...

  scan-vuln:
    desc: govulncheck — vulnerabilities with a reachable call path in the module graph
    cmds:
      - |
        command -v govulncheck >/dev/null 2>&1 || {
          echo "missing govulncheck"
          echo "install: go install golang.org/x/vuln/cmd/govulncheck@latest"
          exit 2
        }
        govulncheck ./...

  scan-sec:
    desc: gosec — project-wide security rules, minus the classes golangci's per-site nolints already adjudicate
    cmds:
      - |
        command -v gosec >/dev/null 2>&1 || {
          echo "missing gosec"
          echo "install: go install github.com/securego/gosec/v2/cmd/gosec@latest"
          exit 2
        }
        # Standalone gosec honors only //nosec, not the //nolint:gosec comments
        # golangci's gosec linter enforces per-site — so the already-adjudicated
        # classes are excluded here instead of re-flagging ~350 findings:
        #   G115 integer conversions (wire narrowing, reviewed per site in lint)
        #   G401/G501 MD5 (rAthena use_MD5_passwords protocol compat)
        #   G404/G109 (game RNG; bounded Ai conversion, per-site justified)
        #   G304 file inclusion (operator-configured rAthena data paths)
        # No severity/confidence floor: a LOW-severity finding is still a
        # finding (probe-verified — the floor silently dropped real classes).
        gosec -quiet -exclude=G115,G401,G501,G404,G109,G304 ./...

  hooks:
    desc: Activate the repo-local git hook gate (.githook) for this clone
    cmds:
      - git config --local core.hooksPath .githook
      - echo "core.hooksPath -> .githook"
      - echo "  pre-commit runs fmt-check + vet; pre-push runs L1 (fmt/lint/vet/scans) + L2 + L3"
      - echo "  bypass a run with GATE_SKIP=1"

  hooks-off:
    desc: Deactivate the repo-local git hook gate
    cmds:
      - git config --local --unset core.hooksPath || true
      - echo "core.hooksPath unset for this clone"

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  test-unit:
    desc: Hermetic unit tests with -race (set COVERPROFILE=path to also emit coverage)
    cmds:
      - |
        if [ -n "${COVERPROFILE:-}" ]; then
          go test -race -tags=unit -covermode=atomic -coverprofile="${COVERPROFILE}" ./internal/... ./pkg/...
        else
          go test -race -tags=unit ./internal/... ./pkg/...
        fi

  coverage:
    desc: One -race run + a coverage floor on the pkg kernel (COVERAGE_MIN, default 60)
    cmds:
      - COVERPROFILE=coverage.out task test-unit
      - |
        min="${COVERAGE_MIN:-60}"
        { grep -E '^mode:' coverage.out; grep -E '/pkg/' coverage.out; } > coverage-kernel.out
        total="$(go tool cover -func=coverage-kernel.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
        echo "pkg kernel coverage: ${total}% — floor ${min}%"
        if ! awk -v t="$total" -v m="$min" 'BEGIN {exit !(t >= m)}'; then
          echo "coverage below floor: ${total}% < ${min}%"
          exit 1
        fi

  test-integration:
    desc: Integration tests against real MariaDB/Postgres via testcontainers (needs a container runtime)
    cmds:
      - go test -race -tags=integration ./...

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  loadtest:
    desc: Boot the compose stack, seed the loadgen account, run the login-load baseline (LOADGEN_CONNS/LOADGEN_RATE/LOADGEN_DURATION tune it; LOADTEST_KEEP=1 leaves the stack up)
    cmds:
      - |
        set -e
        echo "▶ compose up (login limiter disabled for the baseline)"
        GATEWAY_LOGIN_RATE_BURST=0 GATEWAY_LOGIN_RATE_PER_SEC=0 docker compose up -d --build goathena
        echo "▶ waiting for /readyz"
        ready=0
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then ready=1; break; fi
          sleep 2
        done
        if [ "$ready" != 1 ]; then
          echo "readyz never passed; last logs:"
          docker compose logs goathena | tail -20
          exit 1
        fi
        echo "▶ seeding loadgen account"
        # DELETE+INSERT (not INSERT IGNORE): rAthena's login.userid carries a
        # plain KEY, not UNIQUE, so IGNORE would happily accumulate dupes.
        docker compose exec -T mariadb mariadb -uroot -pragnarok ragnarok \
          -e "DELETE FROM login WHERE userid='loadgen'; INSERT INTO login (userid, user_pass, sex) VALUES ('loadgen', MD5('loadgen'), 'M');"
        echo "▶ loadgen: ${LOADGEN_CONNS:-10} conns × ${LOADGEN_RATE:-2}/s for ${LOADGEN_DURATION:-30s}"
        go run ./cmd/loadgen \
          -conns "${LOADGEN_CONNS:-10}" -rate "${LOADGEN_RATE:-2}" -duration "${LOADGEN_DURATION:-30s}"
        if [ "${LOADTEST_KEEP:-0}" != 1 ]; then
          echo "▶ compose down"
          docker compose down
        else
          echo "▶ stack left up (LOADTEST_KEEP=1)"
        fi

  verify:
    desc: Leave the tree passing every gate (tidy + fmt-check + lint + vet + scans + unit + coverage)
    deps: [tidy]
    cmds:
      - task: fmt-check
      - task: lint
      - task: vet
      - task: scan-vuln
      - task: scan-sec
      - task: coverage

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin coverage.out coverage-kernel.out
