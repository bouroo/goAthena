# goAthena local stack. Hobbyist tier: one goathena + MariaDB + Valkey + NATS.
# `docker compose up -d mariadb valkey nats` starts just the backing services;
# the goathena service runs the app (builds from Containerfile).
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ragnarok
      MARIADB_DATABASE: ragnarok
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ragnarok
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # Use the env var (not a hardcoded password) so this stays correct if the
      # root password changes. $$ escapes the $ so compose doesn't interpolate it;
      # the container's sh resolves MARIADB_ROOT_PASSWORD at healthcheck time.
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p\"$$MARIADB_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  valkey:
    image: valkey/valkey:9
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nats:
    # 2-alpine ships wget (the scratch nats:2 has no shell/http-client), so a
    # healthcheck can probe the monitoring /healthz endpoint.
    image: nats:2-alpine
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring on 8222
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  goathena:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      mariadb: { condition: service_healthy }
      valkey: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      APP_ENVIRONMENT: production
      DB_HOST: mariadb
      VALKEY_HOST: valkey
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080" # control plane (health/metrics/ops)
      - "6900:6900" # login
      - "6121:6121" # char
      - "5121:5121" # map

volumes:
  mariadb-data: {}
