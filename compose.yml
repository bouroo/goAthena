services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    container_name: goathena-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-goathena}
      MARIADB_DATABASE: ${DB_NAME:-goathena}
      MARIADB_USER: ${DB_USER:-goathena}
      MARIADB_PASSWORD: ${DB_PASSWORD:-goathena}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - goathena

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: goathena-valkey
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - goathena

  nats:
    image: docker.io/library/nats:2-alpine
    container_name: goathena-nats
    command: ["nats-server", "-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - goathena

  # One-shot schema migration. It builds (and tags) the single goathena image
  # that the `goathena` service below reuses, then runs `goathena migrate up`
  # against MariaDB and exits. `restart: "no"` keeps it a true init container;
  # the app service waits on service_completed_successfully.
  migrate:
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: goathena:dev
    container_name: goathena-migrate
    command: ["migrate", "up"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DB_DRIVER: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-goathena}
      DB_PASSWORD: ${DB_PASSWORD:-goathena}
      DB_NAME: ${DB_NAME:-goathena}
      DB_SSL_MODE: "false"
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      NATS_URL: nats://nats:4222
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"
    networks:
      - goathena

  # The modular-monolith server process (`goathena serve`). Single binary,
  # single container: it serves HTTP health/gRPC now and grows the login/char/
  # map game listeners in M1+. Reuses the image built by `migrate` above.
  goathena:
    image: goathena:dev
    container_name: goathena
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_NAME: goathena
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      DB_DRIVER: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-goathena}
      DB_PASSWORD: ${DB_PASSWORD:-goathena}
      DB_NAME: ${DB_NAME:-goathena}
      DB_SSL_MODE: "false"
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      NATS_URL: nats://nats:4222
      GATEWAY_TCP_ADDR: ":6900"
      GATEWAY_WS_ADDR: ":6901"
      GATEWAY_PACKETVER: "20250604"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAME: goathena
    ports:
      - "8080:8080"
      - "50051:50051"
      # Game ports — login/char/map TCP :6900 and WebSocket :6901 — publish when
      # the gateway listener lands (M1). The app already reads GATEWAY_TCP_ADDR
      # and GATEWAY_WS_ADDR above.
    healthcheck:
      test: ["CMD", "/healthcheck", "-url", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - goathena

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.114.0
    container_name: goathena-otel-collector
    profiles:
      - observability
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./deployments/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    networks:
      - goathena

  prometheus:
    image: docker.io/prom/prometheus:v3.0.1
    container_name: goathena-prometheus
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./deployments/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - goathena

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: goathena-grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - goathena

volumes:
  mariadb_data:
  valkey_data:
  prometheus_data:
  grafana_data:

networks:
  goathena:
    driver: bridge
