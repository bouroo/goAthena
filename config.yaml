# goAthena default configuration. Every field has a built-in default and can be
# overridden by an environment variable of the same name (see .env.example).
# Local dev edits this file; containers set env vars.

app:
  name: goathena
  environment: development          # development|staging|production|test
  host: 0.0.0.0
  port: 8080                        # control-plane HTTP (health/metrics/ops)
  shutdown_timeout: 15s

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  health_probe_timeout: 2s

db:                                 # mariadb:// (compat) or postgres:// (prod)
  driver: mariadb
  host: 127.0.0.1
  port: 3306
  name: ragnarok
  user: ragnarok
  password: ragnarok
  ssl_mode: disable

valkey:                             # sessions + hot cache (Redis-compatible)
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

nats:                               # inter-service event bus (scale-out seam)
  url: nats://127.0.0.1:4222

gateway:                            # RO game-protocol listeners
  login_host: 0.0.0.0               # bind host for all listeners
  login_port: 6900                  # the only static port the client knows
  char_host: 127.0.0.1              # advertised char-server host (client-facing)
  char_port: 6121                   # advertised during login->char handoff
  map_host: 127.0.0.1               # advertised map-server host (client-facing)
  map_port: 5121                    # advertised during char->map handoff

identity:
  use_md5_passwords: true           # mirrors rAthena use_MD5_passwords
  max_chars: 9                      # mirrors rAthena chars_per_account

zone:
  tick_rate_hz: 50                  # 20ms game loop (matches rAthena)
  view_range_cells: 20              # AOI visibility radius
  db_path: third_party/rathenaThailand/db   # load real pre-re mobs/items/skills from the submodule

  directory:                        # cross-zone handoff routing (M12/M13)
    mode: local                     # local|agones|static
    # agones: resolve maps against Agones GameServers (K8s API; in-cluster
    # credentials, or KUBECONFIG for Swarm/workstation runs).
    # namespace: default            # GameServer namespace
    # selector: ""                  # label selector narrowing candidates
    # self_name: ""                 # THIS pod's GameServer resource name (own maps stay local)
    # static: fixed route table (Swarm / fixed sharding) — map → host:port
    # routes:
    #   geffen: 10.0.4.7:5121
    #   payon: 10.0.4.8:5121
log:
  level: info                       # debug|info|warn|error
  format: json                      # json|text

otel:
  exporter: none                    # none|otlp
  endpoint: ""
  service_name: goathena
  sampling: 1.0
