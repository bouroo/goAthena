# Prune image tags from the ghcr.io package.
#
# The publish job only ever adds tags, so the registry accumulates every
# build a release ever made — including builds whose binaries carry HIGH
# advisories that a later release fixed. Deleting them needs
# `packages: delete`, which only the workflow's own GITHUB_TOKEN has (a
# local `gh` token without that scope cannot delete a package version),
# so the prune has to run here.
#
# It goes through the GitHub Packages API, not the registry's own DELETE:
# ghcr.io answers the registry's manifest DELETE with 405 UNSUPPORTED for
# every token, so the API is the only route that works.
#
# Usage: Actions -> Prune image tag -> run, with `tag` set.
name: Prune image tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to delete (e.g. 0.1.0-beta.9)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prune:
    name: Delete the tag's package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ github.event.repository.name }}
      TAG: ${{ inputs.tag }}
      API: https://api.github.com
    steps:
      - name: Find the package version holding the tag
        id: version
        run: |
          set -euo pipefail
          # A user-owned package is addressed under /users; an org-owned one
          # under /orgs. The owner name alone does not say which.
          if curl -fsSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${API}/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=1" | grep -q '^200$'; then
            base="${API}/users/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            base="${API}/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          id="$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${base}?per_page=100" \
            | python3 -c '
import json, os, sys
tag = os.environ["TAG"]
for v in json.load(sys.stdin):
    tags = [c.get("name") for c in v.get("metadata", {}).get("container", {}).get("tags", [])]
    if tag in tags:
        print(v["id"])
        break
')"
          if [ -z "$id" ]; then
            echo "::error::no package version carries the tag ${TAG}"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "package version ${id} carries ${TAG}"

      - name: Delete the package version
        env:
          BASE: ${{ steps.version.outputs.base }}
          ID: ${{ steps.version.outputs.id }}
        run: |
          set -euo pipefail
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${BASE}/${ID}"
          echo "deleted package version ${ID}"

      - name: Confirm the tag is gone
        env:
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          if curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${BASE}?per_page=100" \
            | python3 -c '
import json, os, sys
tag = os.environ["TAG"]
found = any(tag in [c.get("name") for c in v.get("metadata", {}).get("container", {}).get("tags", [])]
            for v in json.load(sys.stdin))
sys.exit(1 if found else 0)
'; then
            echo "::error::${TAG} is still present"
            exit 1
          fi
          echo "${TAG} is gone"
