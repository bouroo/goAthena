name: Release

# Build and push the goathena image to ghcr.io on version tags (v*) that
# point at main's history. The image is tagged with both the git ref
# (e.g. v1.2.3) and `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Releases publish from main only. A tag push carries no branch context
  # (and GitHub cannot filter tag triggers by branch), so the rule is
  # enforced as ancestry: the tagged commit must be reachable from
  # origin/main. A tag cut on develop or any side branch fails here, before
  # the image is built or pushed anywhere.
  guard:
    name: Tag points at main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ancestry needs history, not just the tagged commit
      - name: Verify the tagged commit is reachable from origin/main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "tag ${{ github.ref_name }} points at main history — publishing"
          else
            echo "::error::tag ${{ github.ref_name }} does not point at a commit on main — cut release tags from main only"
            exit 1
          fi

  publish:
    name: Build & push image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # #16: scan the published image for known vulnerabilities. Runs after the push
  # and fails the release on HIGH/CRITICAL findings so a vulnerable image is
  # flagged at the gate (it does not un-push, but blocks a green release).
  scan:
    name: Scan image (trivy)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The scan must reference the exact image the publish job pushed. Two
      # gotchas: (1) docker/metadata-action lowercases github.repository for the
      # build, so the image lives at ghcr.io/bouroo/goathena — trivy rejects the
      # mixed-case ref github.repository expands to; (2) the :latest tag is gated
      # to the default branch, but cd.yml only fires on version tags, so latest is
      # never published here — scan the semver tag the tag-push actually built.
      - name: Resolve image ref
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
