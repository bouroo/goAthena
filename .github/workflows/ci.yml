name: CI

on:
  push:
    branches: [main, develop]
    # Productivity fast path: a docs/handoff-only push does not need four
    # runners, a MariaDB + a Postgres. Skipping the workflow entirely is cheaper
    # than any job-level filter. NB: if branch protection later requires these
    # checks, a docs-only PR will report "expected — waiting" and must be
    # handled (add a same-named no-op job, or drop paths-ignore for PRs).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # Manual dispatch lets callers override any version; the defaults below are
  # the latest stable releases. push/PR runs pass no inputs, so each version
  # coalesces (||) to its latest-stable default.
  workflow_dispatch:
    inputs:
      go-version:
        description: "Go version (setup-go syntax, e.g. 'stable' or '1.27.x')"
        default: "stable"
      golangci-lint-version:
        description: "golangci-lint release tag"
        default: "v2.13.2"
      mariadb-version:
        description: "MariaDB image tag"
        default: "11.8"
      postgres-version:
        description: "PostgreSQL image tag"
        default: "18"
      valkey-version:
        description: "Valkey image tag"
        default: "9"
      nats-version:
        description: "NATS image tag"
        default: "2-alpine"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned version constants. Every job references these so a bump happens in one
# place. They are also overridable via workflow_dispatch inputs (coalesced).
#
# GO_VERSION tracks upstream `stable` deliberately: the project builds on the
# current Go release (go.mod and the Containerfile's golang image follow it).
#
# The consequence is that GOLANGCI_LINT_VERSION must be kept in step with it.
# golangci-lint embeds its own Go type-checker, so it can only read a stdlib no
# newer than the Go it was built against. A stale linter against a newer
# toolchain dies *inside the standard library* with `could not import
# math/rand/v2 (... method must have no type parameters) (typecheck)` — a
# failure naming no project file, so it reads as noise. This broke CI on
# 2026-09-19 when `stable` moved to Go 1.27.1 while lint stayed on v2.12.2
# (built with Go 1.27). When Go stable moves, bump this too, and confirm with a
# local `golangci-lint run` on the same toolchain.
env:
  GO_VERSION: ${{ inputs.go-version || 'stable' }}
  GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version || 'v2.13.2' }}
  # Pinned so CI cannot break on an unrelated upstream release. `@latest` here
  # is a live footgun: a new gofumpt/gofmt style rule turns every open branch
  # red with no project change. Bump deliberately, in step with `task fmt`.
  GOFUMPT_VERSION: v0.11.0
  TASK_VERSION: v3.53.1
  # Security scanners, pinned for the same reason as GOFUMPT: a new advisory
  # or rule in an unpinned scanner reddens the tree with no project change.
  # Bump deliberately, in step with the local `task scan-*` gate.
  GOVULNCHECK_VERSION: v1.7.0
  GOSEC_VERSION: v2.29.0
  MARIADB_VERSION: ${{ inputs.mariadb-version || '11.8' }}
  POSTGRES_VERSION: ${{ inputs.postgres-version || '18' }}
  VALKEY_VERSION: ${{ inputs.valkey-version || '9' }}
  NATS_VERSION: ${{ inputs.nats-version || '2-alpine' }}
  # The L2 gate's stated coverage target (docs/handoff.md §1). Enforced on the
  # carried pkg/ro kernel, which is the only subtree with near-total coverage;
  # the app layer is measured but not gated while it is still filling in.
  COVERAGE_MIN: "60"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  # The local pre-push hook runs the same `task scan-*` targets, so a finding
  # surfaces on the dev machine before it costs a CI round trip. gosec's rule
  # exclusions are documented in the Taskfile target (shared with the hook —
  # the two cannot drift).
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install task + govulncheck + gosec (pinned)
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - run: go mod download
      - name: govulncheck (reachable call paths)
        run: task scan-vuln
      - name: gosec (adjudicated rules excluded)
        run: task scan-sec

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Single dev-tool install step, shared by the fmt check via $GITHUB_PATH.
      # Pinned (not @latest) so an upstream style change cannot redden the tree
      # without a project change; `task` lets the job run the same targets as
      # the local hook, so CI and the hook cannot drift.
      - name: install task + gofumpt + goimports
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          go install golang.org/x/tools/cmd/goimports@latest
      - run: go mod download
      - name: go vet
        run: task vet
      - name: formatting check
        run: task fmt-check
      - name: unit tests (-race) + coverage floor
        run: task coverage

  integration:
    name: Integration tests
    # Gate the slow service-backed jobs behind the fast static ones: a lint,
    # unit, or security failure fails the run in ~30s instead of burning a
    # runner + four service containers for four minutes first.
    needs: [lint, unit, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        # NB: the `env` context is not available in `services.image`; use
        # `inputs` (which is) with coalesce to the latest-stable default.
        image: mariadb:${{ inputs.mariadb-version || '11.8' }}
        env:
          MARIADB_ROOT_PASSWORD: ragnarok
          MARIADB_DATABASE: n
          MARIADB_USER: r
          MARIADB_PASSWORD: r
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pragnarok"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      valkey:
        image: valkey/valkey:${{ inputs.valkey-version || '9' }}
        ports:
          - 16379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
      nats:
        image: nats:${{ inputs.nats-version || '2-alpine' }}
        ports:
          - 4222:4222
        options: >-
          --health-cmd="wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    env:
      DB_DRIVER: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 13306
      DB_NAME: n
      DB_USER: r
      DB_PASSWORD: r
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 16379
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: apply schema
        run: |
          go build -o /tmp/goathena ./cmd/goathena
          /tmp/goathena migrate up -config <(printf 'app:\n  environment: test\ndb:\n  driver: mariadb\n  host: 127.0.0.1\n  port: 13306\n  name: n\n  user: r\n  password: r\n  ssl_mode: disable\n')
      - name: seed test data
        run: |
          docker run --rm --network host mariadb:${{ env.MARIADB_VERSION }} \
            mariadb -h 127.0.0.1 -P 13306 -ur -pr n \
            -e "INSERT IGNORE INTO login (account_id,userid,user_pass,sex,email) VALUES (2000001,'testacc',MD5('s3cret'),'M','t@t');
                INSERT IGNORE INTO \`char\` (account_id,char_num,name,base_level,job_level,max_hp,hp,max_sp,sp,last_map,save_map) VALUES (2000001,0,'Hero',1,1,1000,1000,50,50,'new_1-1','new_1-1');"
      - name: integration tests (-race)
        run: go test -race -tags=integration ./...

  # #11: the per-engine migrations (commit 2807002) added a postgres path, but
  # only mariadb had CI coverage. This job mirrors the mariadb integration job
  # against a postgres service so the reserved-word-safe GORM read path
  # (`int`/`rename` columns) and the postgres migrations are exercised on every
  # push/PR. Run in parallel with the mariadb job.
  postgres-integration:
    name: Integration tests (postgres)
    needs: [lint, unit, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version || '18' }}
        env:
          POSTGRES_PASSWORD: ragnarok
          POSTGRES_DB: n
          POSTGRES_USER: r
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U r -d n"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      valkey:
        image: valkey/valkey:${{ inputs.valkey-version || '9' }}
        ports:
          - 16379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
      nats:
        image: nats:${{ inputs.nats-version || '2-alpine' }}
        ports:
          - 4222:4222
        options: >-
          --health-cmd="wget -qO- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10
    env:
      DB_DRIVER: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 15432
      DB_NAME: n
      DB_USER: r
      DB_PASSWORD: ragnarok
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: 16379
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - name: apply schema (postgres)
        run: |
          go build -o /tmp/goathena ./cmd/goathena
          /tmp/goathena migrate up -config <(printf 'app:\n  environment: test\ndb:\n  driver: postgres\n  host: 127.0.0.1\n  port: 15432\n  name: n\n  user: r\n  password: ragnarok\n  ssl_mode: disable\n')
      - name: seed test data
        run: |
          PGPASSWORD=ragnarok psql -h 127.0.0.1 -p 15432 -U r -d n -c "INSERT INTO login (account_id,userid,user_pass,sex,email,state,unban_time,expiration_time) OVERRIDING SYSTEM VALUE VALUES (2000001,'testacc',md5('s3cret'),'M','t@t',0,0,0) ON CONFLICT DO NOTHING;
            INSERT INTO \"char\" (char_id,account_id,char_num,name,base_level,job_level,max_hp,hp,max_sp,sp,last_map,save_map) OVERRIDING SYSTEM VALUE VALUES (150001,2000001,0,'Hero',1,1,1000,1000,50,50,'new_1-1','new_1-1') ON CONFLICT DO NOTHING;"
      - name: integration tests (-race)
        run: go test -race -tags=integration ./...

  build:
    name: Build image
    # Only package an image the trees that ran against it have validated.
    needs: [lint, unit, security, integration, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build binary
        run: go build -ldflags="-s -w" -o bin/goathena ./cmd/goathena
      - name: build container image
        run: docker build -f Containerfile -t goathena:ci .
