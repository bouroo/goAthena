# Postgres — the durable state (accounts, characters, items, mail, ledger).
#
# The shard set is a fleet over one database: the shards own disjoint map
# sets, and the rows they touch are partitioned by account/character, so
# they share a primary without contention on a row. The zone-directory
# indirection is what keeps a shard's writes inside its own map set.
#
# A PVC, not an emptyDir: the ledger and the mail are durable state, and a
# pod restart must not lose them. The prod overlay points the claim at a
# storage class with real disks (the default local-path class is node-local
# and loses the volume when the node goes away).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: goathena
  name: goathena-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  namespace: goathena
  name: goathena-postgres
spec:
  selector:
    app.kubernetes.io/name: goathena-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: goathena
  name: goathena-postgres
  labels:
    app.kubernetes.io/name: goathena-postgres
    app.kubernetes.io/component: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: goathena-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goathena-postgres
        app.kubernetes.io/component: infra
        # The backing services are upstream images that cannot satisfy the
        # namespace's restricted profile. The exemption is by pod label, so
        # it covers exactly these pods.
        pod-security.kubernetes.io/enforce: baseline
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ragnarok
            - name: POSTGRES_USER
              value: ragnarok
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goathena-db
                  key: postgres-password
            # The shards run as one user against one database.
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U ragnarok -d ragnarok
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U ragnarok
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: goathena-postgres-data
