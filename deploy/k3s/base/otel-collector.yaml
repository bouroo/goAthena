# The OTel collector — the shards' trace and metric sink.
#
# The shards export OTLP to this collector (OTEL_EXPORTER_OTLP_ENDPOINT in
# the Fleet's env). The collector receives and batches; what it forwards to
# is the operator's choice, so the base ships a debug exporter that proves
# the pipeline carries data without committing to a backend.
#
# The prod overlay replaces the exporters with Prometheus and a tracing
# backend.
apiVersion: v1
kind: Service
metadata:
  namespace: goathena
  name: goathena-otel-collector
spec:
  selector:
    app.kubernetes.io/name: goathena-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: goathena
  name: goathena-otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
    exporters:
      # The base proves the pipeline without committing to a backend: the
      # debug exporter writes what it received to the collector's own log.
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: goathena
  name: goathena-otel-collector
  labels:
    app.kubernetes.io/name: goathena-otel-collector
    app.kubernetes.io/component: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goathena-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goathena-otel-collector
        app.kubernetes.io/component: infra
        # The backing services are upstream images that cannot satisfy the
        # namespace's restricted profile. The exemption is by pod label, so
        # it covers exactly these pods.
        pod-security.kubernetes.io/enforce: baseline
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.140.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: goathena-otel-collector-config
