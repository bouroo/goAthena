# The database password the shards read.
#
# This is a placeholder, and it says so: the base must apply as-is on a
# workstation or a CI cluster, so it carries a value that is obviously not a
# secret. The prod overlay replaces the whole Secret (see
# overlays/prod/README.md) — either with a sealed secret, or with a
# controller (External Secrets, Sealed Secrets) that fills it from a vault.
#
# The dev overlay keeps this value so a local k3s (k3d, kind, k3s) works
# end to end with one command.
apiVersion: v1
kind: Secret
metadata:
  namespace: goathena
  name: goathena-db
type: Opaque
stringData:
  # PLACEHOLDER — replace in the prod overlay. Never a real credential.
  password: ragnarok
  # The postgres superuser and the application user share it here; the
  # prod overlay splits them.
  postgres-password: ragnarok
