# Valkey — the session store and the hot cache.
#
# A login session is written here and read by whichever shard the client
# is redirected to, so every shard must reach the same Valkey. That is why
# it is a Service with a stable name and not a sidecar: a sidecar's
# localhost would give each shard its own session store, and the
# char->map handoff would fail on a session the shard cannot see.
#
# The persistence is off on purpose: a session is a short-lived artifact,
# and a lost one costs a re-login. The prod overlay raises the memory
# limit and turns on replication.
apiVersion: v1
kind: Service
metadata:
  namespace: goathena
  name: goathena-valkey
spec:
  selector:
    app.kubernetes.io/name: goathena-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: goathena
  name: goathena-valkey
  labels:
    app.kubernetes.io/name: goathena-valkey
    app.kubernetes.io/component: infra
spec:
  serviceName: goathena-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goathena-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goathena-valkey
        app.kubernetes.io/component: infra
        # The backing services are upstream images that cannot satisfy the
        # namespace's restricted profile. The exemption is by pod label, so
        # it covers exactly these pods.
        pod-security.kubernetes.io/enforce: baseline
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
