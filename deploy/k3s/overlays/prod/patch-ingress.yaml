# The production ingress host.
#
# The client reaches the login port by name — it is the server list entry
# — so the host is what the client is configured with. The char and map
# ports are reached by address (the handshake carries an IPv4), so the
# operator must also set gateway.char_host and gateway.map_host to the
# ingress's external address; those live in the ConfigMap.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goathena-login
spec:
  rules:
    - host: game.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goathena-login
                port:
                  name: login
